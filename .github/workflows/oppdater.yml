name: Oppdater RUH-tavle
on:
  schedule:
    - cron: "0 4 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oppdater
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent data fra Dalux og bygg sidene
        env:
          DALUX_API_KEY: ${{ secrets.DALUX_API_KEY }}
        run: |
          python fetch2.py
          python agg.py
          python build_site.py
      - name: Lagre endringer
        run: |
          git config user.name "RUH-oppdatering"
          git config user.email "actions@users.noreply.github.com"
          git add LnsIpb4xfmjasr9s7ae5xugtLI2x4Kaj/index.html I34P4eh17y95xuDE5FtIT4IBUk0tV8JW/index.html
          git diff --cached --quiet || git commit -m "Oppdater RUH-tavle"
          git pull --rebase
          git push
