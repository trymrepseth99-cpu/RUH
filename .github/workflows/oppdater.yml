name: Oppdater RUH-tavle
on:
  schedule:
    - cron: "0 5 * * 2,4"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent data fra Dalux og bygg tavlen
        env:
          DALUX_API_KEY: ${{ secrets.DALUX_API_KEY }}
        run: |
          python fetch2.py
          python agg.py
          python build_site.py
      - name: Lagre endringer
        run: |
          git config user.name "RUH-oppdatering"
          git config user.email "actions@users.noreply.github.com"
          git add LnsIpb4xfmjasr9s7ae5xugtLI2x4Kaj/index.html
          git diff --cached --quiet || git commit -m "Oppdater RUH-tavle"
          git push
